name: amigo
description: "A chat app"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
 
# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 3.1.0+24


environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  shadcn_flutter: ^0.0.47
  flutter_dotenv: ^6.0.0
  dotenv: ^4.2.0
  logging: ^1.3.0
  http: ^1.5.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  path_provider: ^2.1.5
  flutter_contacts: ^1.1.9+2
  permission_handler: ^12.0.1
  image_picker: ^1.0.4
  file_picker: ^8.0.0
  photo_view: ^0.14.0
  video_player: ^2.8.1
  chewie: ^1.7.5
  url_launcher: ^6.2.2
  path: ^1.8.3
  flutter_sound: ^9.2.13
  geolocator: ^12.0.0
  # The real flutter_webrtc plugin can't ship in the same APK as
  # stream_video_flutter (both occupy the org.webrtc.* package). When the Stream
  # backend is selected, `dependency_overrides` below swaps this entry for a
  # local stub package so the legacy WebRTC source still compiles. To revive
  # the real WebRTC backend, drop the override + remove the stream_video_*
  # dependencies, then re-run `flutter pub get`.
  flutter_webrtc: ^1.3.1
  wakelock_plus: ^1.2.8
  flutter_foreground_task: ^8.11.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^18.0.1
  restart_app: ^1.3.1
  flutter_riverpod: ^3.0.0
  open_file: ^3.5.7
  share_plus: ^10.0.2
  device_info_plus: ^12.3.0
  # flutter_callkit_incoming: ^3.0.0  # Commented out - replaced by native Kotlin call screen
  sqflite: ^2.4.2
  cached_network_image: ^3.4.1
  crypto: ^3.0.3
  receive_sharing_intent: ^1.8.1
  video_thumbnail: ^0.5.6
  proximity_screen_lock: ^2.2.0
  screen_brightness: ^2.1.7
  proximity_sensor: ^1.3.9
  flutter_cache_manager: ^3.4.1
  mime: ^2.0.0
  package_info_plus: ^9.0.0
  drift: ^2.29.0
  drift_flutter: ^0.2.7
  flutter_background_service: ^5.1.0
  flutter_ringtone_player: ^4.0.0+4
  drift_db_viewer: ^2.1.0
  connectivity_plus: ^7.0.0
  logger: ^2.6.2
  emoji_picker_flutter: ^4.3.0
  scroll_to_index: ^3.0.1
  uuid: ^4.5.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # ---- Stream Video (alternate calling backend, runtime-switched via env.dart) ----
  stream_video_flutter: ^1.3.3
  stream_video_push_notification: ^1.3.3
  # Picture-in-Picture overlay for video calls when the user backgrounds
  # the app. Pure Flutter wrapper around Android's Activity#enterPictureInPictureMode
  # — no iOS support needed (CallKit handles iOS PiP itself).
  floating: ^4.0.0

# Swap the real `flutter_webrtc` plugin for a local no-op stub so the legacy
# WebRTC backend source still compiles, but only stream_video_flutter ships its
# native `org.webrtc.*` classes — eliminating the dex-merge collision that
# otherwise prevents the Android build. Comment this block out (and remove the
# stream_video_* deps above) to fall back to the real WebRTC backend.
#
# `stream_video` is vendored under `vendor/stream_video/` so we can patch a
# specific race in `_handleCoordinatorCallAccepted` / `_handleCoordinatorCallRejected`
# (see vendor/stream_video/lib/src/call/call.dart, search for "AMIGO-PATCH").
# The race causes the SDK to self-reject calls the user just accepted because
# the WS broadcast of our accept arrives before `lifecycleCallAccepted()` can
# update local state. Without this patch: B taps Accept → A sees "Call
# declined" → B opens to a ghost call.
dependency_overrides:
  flutter_webrtc:
    path: flutter_webrtc_stub
  stream_video:
    path: vendor/stream_video
  # `stream_video_push_notification` ships a Kotlin `IncomingCallSoundPlayerManager`
  # that plays the system ringtone via Ringtone+USAGE_NOTIFICATION_RINGTONE.
  # On Samsung One UI, if the audio mode is left in MODE_IN_COMMUNICATION
  # from a prior WebRTC session, that combination still routes to the
  # earpiece at in-call volume. Vendored copy adds a MODE_NORMAL reset +
  # FLAG_AUDIBILITY_ENFORCED right before play().
  stream_video_push_notification:
    path: vendor/stream_video_push_notification
  # `floating` 4.0.1 imports the deprecated v1 `PluginRegistry.Registrar`
  # which was removed in current Flutter SDKs — vendored copy patches the
  # one stray import.
  floating:
    path: vendor/floating

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  drift_dev: ^2.29.0
  build_runner: ^2.7.1
  freezed: ^3.0.3
  json_serializable: ^6.9.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/sounds/ringing_tone.mp3
    - assets/images/call_bg.png
    - assets/images/call_bg_dark.png
    - assets/images/chat_bg.jpg
    - assets/icons/app_icon.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# App icon configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#5050E0"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#5050E0"
    theme_color: "#5050E0"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"
